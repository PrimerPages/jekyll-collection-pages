# Repository-specific build: the demo needs this Gemfile and the local plugin.

name: Site

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gh-pages-site-pr-{0}', github.event.pull_request.number) || 'gh-pages-site' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      host: ${{ steps.pages.outputs.host }}
      base-path: ${{ steps.pages.outputs.base_path }}
      version: ${{ steps.settings.outputs.version }}
      artifact-name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure site URLs
        id: settings
        env:
          SITE_VERSION: ${{ github.event.release.tag_name || 'dev' }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "version=$SITE_VERSION" >> "$GITHUB_OUTPUT"
          ruby -ryaml -e '
            config = {
              "url" => ENV.fetch("SITE_ORIGIN"),
              "baseurl" => "#{ENV.fetch("SITE_BASE_PATH")}/#{ENV.fetch("SITE_VERSION")}",
              "versions" => {
                "enabled" => true,
                "config" => "#{ENV.fetch("SITE_BASE_PATH")}/versions.json",
                "prefix" => ENV.fetch("SITE_BASE_PATH")
              }
            }
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), "pages.yml"), config.to_yaml)
          '

      - name: Build demo with local plugin
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          bundle exec jekyll build \
            --source demo \
            --destination _site \
            --config "demo/_config.yml,$RUNNER_TEMP/pages.yml" \
            --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site

  test-site:
    needs: build-site
    permissions:
      contents: read
    uses: athackst/ci/.github/workflows/htmlproofer_site.yml@main
    with:
      host: ${{ needs.build-site.outputs.host }}
      base-path: ${{ needs.build-site.outputs.base-path }}
      artifact-name: ${{ needs.build-site.outputs.artifact-name }}

  deploy-site:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published') }}
    needs: build-site
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: athackst/ci/.github/workflows/deploy_site.yml@main
    with:
      type: branch
      version: ${{ needs.build-site.outputs.version }}
    secrets: inherit
