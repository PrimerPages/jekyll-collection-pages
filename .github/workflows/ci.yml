name: CI jekyll plugin

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: RuboCop Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop
  # test job
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test active versions of ruby and github pages combo
        ruby: ['3.2', '3.3', '3.4']
        jekyll: ['3.10.0', '4.3.4', '4.4.0', '4.4.1'] 
    name: Test Ruby ${{ matrix.ruby }} / Jekyll ${{ matrix.jekyll }}
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Test spec
        run: .github/test.sh

      - name: Show installed gems
        if: failure()
        run: bundle list

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test active versions of ruby and github pages combo
        ruby: ['3.2', '3.3', '3.4']
        jekyll: ['3.10.0', '4.3.4', '4.4.0', '4.4.1'] 
    name: Build Ruby ${{ matrix.ruby }} / Jekyll ${{ matrix.jekyll }}
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Run build
        run: .github/build.sh

  ci_success:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [lint, test, integration]
    steps:
      - name: Check required job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::All required jobs must succeed. A job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required jobs passed!"
